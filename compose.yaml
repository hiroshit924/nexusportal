services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${NEXUS_DB_PASSWORD:?Run bash scripts/start-wordpress.sh first}
      MARIADB_ROOT_PASSWORD: ${NEXUS_DB_ROOT_PASSWORD:?Run bash scripts/start-wordpress.sh first}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 3s
      retries: 30

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    environment: &wp_environment
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${NEXUS_DB_PASSWORD:?Run bash scripts/start-wordpress.sh first}
    ports:
      - "127.0.0.1:${NEXUS_WP_PORT:-8080}:80"
    volumes: &wp_volumes
      - wp_data:/var/www/html
      - ./wp-content/themes/nexus-portal:/var/www/html/wp-content/themes/nexus-portal:ro
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, 'http://127.0.0.1/wp-login.php']
      interval: 3s
      timeout: 3s
      retries: 30

  wpcli:
    image: wordpress:cli-php8.3
    profiles: [cli]
    user: '33:33'
    environment: *wp_environment
    volumes: *wp_volumes

volumes:
  db_data:
  wp_data:
